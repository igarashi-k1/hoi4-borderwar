l_english:
 borderwar_category:0 "Border Conflicts"
 borderwar_category_desc:0 "Demand the cession of territory from our neighbours. Should they refuse, we shall answer with the bayonet."
 bw_demand_state:0 "Demand the Cession of [FROM.GetName]"
 bw_demand_state_desc:0 "Demand the cession of a border territory that is not a core land of its owner. Should they refuse, we may ignore them, start a border conflict, or declare war."
 borderwar.1.t:0 "Territorial Demands from [From.GetName]"
 borderwar.1.d:0 "With breathtaking insolence, the government of [From.GetName] has unilaterally demanded that we cede the vital border region of [bw_state.GetName], and openly threatens force should we refuse. What madness has seized these upstarts who know not their place?"
 borderwar.1.a:0 "Take it. If that wasteland satisfies them, it is a small price."
 borderwar.1.b:0 "Dream on. If they want it, let them come and take it."
 borderwar.1.d_ally:0 "Our friends in [From.GetName] have asked us to cede [bw_state.GetName] on our shared border. Thinking of the future our nations share, a small patch of land is not worth begrudging."
 borderwar.1.a_ally:0 "For the future we share. We give it gladly."
 borderwar.1.c:0 "Dream on - preferably in your sleep. A mere vassal begging its master for land? Laughable."
 bw_demand_core_state:0 "Demand the Surrender of [FROM.GetName]"
 bw_demand_core_state_desc:0 "Demand that our neighbour surrender a border territory that is part of its very homeland. They will almost certainly refuse. Should they do so, we may ignore them, start a border conflict, or declare war."
 borderwar.4.t:0 "[From.GetName] Demands Our Homeland"
 borderwar.4.d:0 "Has [From.GetName] taken leave of its senses? Its government demands that we hand over [bw_state.GetName], the land of our forefathers. To surrender a single handful of our native soil would be the death of the nation. The sheer gall of these thieves!"
 borderwar.4.a:0 "...We shall swallow the humiliation of selling our homeland."
 borderwar.4.b:0 "Not one inch for thieves. Go home and think again."
 borderwar.8.t:0 "[From.GetName] Dismisses Our Demands"
 borderwar.8.d:0 "Our overlord, [From.GetName], laughed our demand out of the room: 'Dream on - preferably in your sleep. A vassal begging its master for scraps is a joke in poor taste.' A bitter reminder of our station."
 borderwar.8.a:0 "...Now is the time to endure."
 bw_demand_annex:0 "Demand the Annexation of [FROM.GetName]"
 bw_demand_annex_desc:0 "This neighbour clings to nothing but its capital. Demand that it submit to annexation. Should it refuse, a declaration of war shall finish the job."
 borderwar.5.t:0 "[From.GetName] Demands Our Annexation"
 borderwar.5.d:0 "The government of [From.GetName] demands the unconditional annexation of our nation, now reduced to its capital alone. We have neither the land nor the troops to resist, and refusal would only bring fire upon the capital."
 borderwar.5.a:0 "...We cannot resist. Our nation's fate is sealed."
 borderwar.5.b:0 "We shall die defending our capital. Let them come."
 borderwar.6.t:0 "[From.GetName] Annexed"
 borderwar.6.d:0 "The government of [From.GetName] has accepted our demands and handed over its land and army. A pitiful end for a pitiful little nation - may it rest in peace within our borders."
 borderwar.6.a:0 "A sensible end."
 borderwar.7.t:0 "[From.GetName] Refuses Annexation"
 borderwar.7.d:0 "Reduced to a single capital, [From.GetName] has had the nerve to reject our demands. With what does this corpse of a nation intend to resist?"
 borderwar.7.a:0 "Leave them. They will rot on their own."
 borderwar.7.b:0 "Put them out of their misery. Declare war."
 borderwar.4.d_ally:0 "Our friends in [From.GetName] have asked us to entrust them with [bw_state.GetName], part of our very homeland. It is the land of our forefathers - yet for the sake of our shared future, handing it over may be the right path."
 borderwar.4.a_ally:0 "It breaks our hearts, but for our shared future, we entrust it to them."
 borderwar.4.c:0 "Talk in your sleep, not to us. A lapdog barking for its master's garden? How amusing."
 borderwar.2.t:0 "[From.GetName] Submits to Our Demands"
 borderwar.2.d:0 "The government of [From.GetName] has bowed to our demands and surrendered [bw_state.GetName]. To turn tail without firing a single shot - a spectacle of cowardice truly worthy of their reputation."
 borderwar.2.a:0 "A wise decision. We shall commend them for it."
 borderwar.2.t_ally:0 "[From.GetName] Graciously Agrees"
 borderwar.2.d_ally:0 "Our friends in [From.GetName] have graciously agreed to our request and entrusted [bw_state.GetName] to us. Rather than cling to a scrap of land, they have looked to the future we shall share - a wise decision that will bind our nations ever closer."
 borderwar.2.a_ally:0 "A wise, far-sighted decision. We will not forget this."
 borderwar.3.t:0 "[From.GetName] Rejects Our Demands"
 borderwar.3.d:0 "The government of [From.GetName] has arrogantly rejected our generous demands. [bw_state.GetName] is our rightful possession. How shall we repay this insolence?"
 borderwar.3.a:0 "Leave them be. We have no time for a dog that only barks."
 borderwar.3.b:0 "Strike them at the border and teach them their place."
 borderwar.3.c:0 "Enough talk. To all forces: declare war!"
 borderwar.10.t:0 "Glorious Victory in the Border Conflict"
 borderwar.10.d:0 "Official communiqué from Supreme Headquarters: our gallant forces have smashed the army of [bw_enemy.GetName] at the border, and the enemy is in full flight. [bw_won_state.GetName] has been liberated and placed under our administration."
 borderwar.10.d_none:0 "Official communiqué from Supreme Headquarters: our gallant forces have smashed the enemy at the border. Regrettably, nothing worth liberating remained."
 borderwar.10.a:0 "Hip, hip, hooray! That will teach the blighters a lesson."
 borderwar.11.t:0 "The Border Conflict Goes Poorly"
 borderwar.11.d:0 "Meeting stubborn enemy resistance, our units have conducted a strategic withdrawal to prepared positions in accordance with plan. The border remains as it was."
 borderwar.11.a:0 "We did not retreat. We regrouped according to plan."
 borderwar.12.t:0 "Stalemate at the Border"
 borderwar.12.d:0 "After a long standoff at the border, both armies have sheathed their swords without a decision. The border remains as it was."
 borderwar.12.a:0 "We will let them off this time."
 borderwar.13.t:0 "The Invaders Repulsed"
 borderwar.13.d:0 "The presumptuous invaders left their dead before the iron wall of our border guards and fled home in shameful disorder."
 borderwar.13.a:0 "Never come back. If you do, the same fate awaits."
 borderwar.14.t:0 "Our Border Guards Overwhelmed"
 borderwar.14.d:0 "Despite their valiant struggle, our border guards could not halt the enemy advance. Part of the border region has fallen into enemy hands."
 borderwar.14.a:0 "We shall never forget this humiliation."
 borderwar.15.t:0 "Stalemate at the Border"
 borderwar.15.d:0 "The invaders failed to breach our border and have withdrawn at last. Our forces, however, did not pursue them."
 borderwar.15.a:0 "Go tremble on your side of the border."
