l_japanese:
 borderwar_category:0 "国境紛争"
 borderwar_category_desc:0 "隣国に対し領土の割譲を迫るべし。拒まば、銃剣を以て之に応えん。"
 bw_demand_state:0 "[FROM.GetName]の割譲を要求す"
 bw_demand_state_desc:0 "我が国境に接し、彼の国の固有の領土に非ざる地の割譲を要求す。彼が拒絶せし時は、黙殺・国境紛争・宣戦布告の何れかを以て応ずべし。"
 borderwar.1.t:0 "[From.GetName]より割譲要求来たる"
 borderwar.1.d:0 "[From.GetName]政府は厚顔にも、我が国境の要衝[bw_state.GetName]の割譲を一方的に要求し来たれり。拒まば武力行使も辞さずと恫喝しておる。身の程を知らぬ連中が、何を血迷うたか。"
 borderwar.1.a:0 "持って行け。その程度の荒れ地で満足するなら安いものだ"
 borderwar.1.b:0 "寝言は寝て言え。欲しくば取りに来るがよい"
 borderwar.1.c:0 "寝言は寝てから言え。属国風情が主人に土地をねだるとは片腹痛い"
 bw_demand_core_state:0 "[FROM.GetName]の割譲を強要す"
 bw_demand_core_state_desc:0 "我が国境に接する、彼の国の本土たる地の割譲を強要す。彼が之を呑むこと万に一つも無かるべし。拒絶せし時は、黙殺・国境紛争・宣戦布告の何れかを以て応ずべし。"
 borderwar.4.t:0 "[From.GetName]、我が本土の割譲を要求す"
 borderwar.4.d:0 "[From.GetName]政府は狂気の沙汰か、我が父祖伝来の地[bw_state.GetName]を差し出せと要求し来たれり。祖国の土を一握りたりとも渡すことは、国家の死を意味す。盗人猛々しいとは正にこのことなり。"
 borderwar.4.a:0 "……祖国を売る屈辱、甘んじて受けよう"
 borderwar.4.b:0 "盗人に渡す土地など一寸も無い。顔を洗って出直して来い"
 borderwar.8.t:0 "[From.GetName]、我が要求を一蹴す"
 borderwar.8.d:0 "宗主国[From.GetName]は我が割譲要求を一笑に付し、「寝言は寝てから言え。属国風情が主人に物を乞うとは片腹痛い」と嘲笑したり。我が国の立場を骨身に沁みて思い知らされる屈辱なり。"
 borderwar.8.a:0 "……今は耐え忍ぶ時だ"
 bw_demand_annex:0 "[FROM.GetName]の併合を要求す"
 bw_demand_annex_desc:0 "首都を残すのみとなりし隣国に対し、我が国への併合を要求す。彼が拒まば、宣戦布告を以て之に引導を渡すべし。"
 borderwar.5.t:0 "[From.GetName]より併合要求来たる"
 borderwar.5.d:0 "[From.GetName]政府は、首都を残すのみとなりし我が国に対し、無条件の併合を要求し来たれり。抗うべき領土も兵力も最早乏しく、拒まば戦火は首都を焼くのみなり。"
 borderwar.5.a:0 "……抗う術無し。国家の命運、此処に尽きたり"
 borderwar.5.b:0 "首都を枕に討死せん。来るなら来い"
 borderwar.6.t:0 "[From.GetName]、我が国に併合さる"
 borderwar.6.d:0 "[From.GetName]政府は我が要求を受け入れ、その国土と軍を我が国に差し出したり。哀れなる小国の最期、せめて我が版図にて安らかに眠るがよい。"
 borderwar.6.a:0 "賢明なる最期であった"
 borderwar.7.t:0 "[From.GetName]、併合要求を拒絶す"
 borderwar.7.d:0 "首都一つを残すのみの[From.GetName]が、身の程も弁えず我が要求を拒絶せり。死に体の国家が何を以て抗わんとするや。"
 borderwar.7.a:0 "放っておけ。いずれ勝手に朽ち果てる"
 borderwar.7.b:0 "引導を渡してやれ。宣戦布告せよ"
 borderwar.4.c:0 "寝言は寝てから言え。飼い犬が主人の庭を寄越せと吠えるとはな"
 borderwar.2.t:0 "[From.GetName]、我が要求に屈す"
 borderwar.2.d:0 "[From.GetName]政府は我が要求に屈し、[bw_state.GetName]を明け渡したり。一発の銃弾も撃たずして尻尾を巻くとは、腰抜けの名に恥じぬ見事な醜態なり。"
 borderwar.2.a:0 "賢明なる判断と褒めてやろう"
 borderwar.3.t:0 "[From.GetName]、要求を拒絶す"
 borderwar.3.d:0 "[From.GetName]政府は、我が寛大なる要求を傲然と拒絶せり。[bw_state.GetName]は我が国当然の権益なり。この無礼に如何にして報いるべきや。"
 borderwar.3.a:0 "捨て置け。吠えるだけの犬に構う暇はない"
 borderwar.3.b:0 "国境にて一撃を加え、身の程を教えてやれ"
 borderwar.3.c:0 "最早問答無用。全軍に告ぐ、宣戦布告せよ"
 borderwar.10.t:0 "国境紛争、我が軍の大勝利"
 borderwar.10.d:0 "大本営発表。我が精鋭は[bw_enemy.GetName]軍を国境にて粉砕し、敵は算を乱して潰走せり。我が軍は[bw_won_state.GetName]を占領し、之を我が版図に編入せり。"
 borderwar.10.d_none:0 "大本営発表。我が精鋭は国境にて敵軍を粉砕せり。然れども、奪うに値する土地は最早残されておらざりき。"
 borderwar.10.a:0 "万歳！ 腰抜けどもに思い知らせてやった"
 borderwar.11.t:0 "国境紛争、戦況芳しからず"
 borderwar.11.d:0 "我が部隊は敵の頑強なる抵抗に遭い、所期の目的を達し得ず、転進を余儀なくされたり。国境線は旧に復す。"
 borderwar.11.a:0 "これは敗北に非ず、転進である"
 borderwar.12.t:0 "国境紛争、膠着のまま停戦"
 borderwar.12.d:0 "両軍国境にて対峙すること久しく、遂に決着を見ずして矛を収めたり。国境線は旧に復す。"
 borderwar.12.a:0 "今日のところは見逃してやる"
 borderwar.13.t:0 "侵略者を撃退す"
 borderwar.13.d:0 "身の程知らずの侵略者は、我が国境守備隊の鉄壁の守りの前に屍を晒し、ほうほうの体で逃げ帰れり。"
 borderwar.13.a:0 "二度と来るな。来れば同じ目に遭わせてやる"
 borderwar.14.t:0 "国境守備隊、衆寡敵せず"
 borderwar.14.d:0 "我が国境守備隊は奮戦虚しく、敵の侵攻を阻み得ず。国境地帯の一部は敵の手に落ちたり。"
 borderwar.14.a:0 "この屈辱、決して忘れまじ"
 borderwar.15.t:0 "国境紛争、膠着のまま停戦"
 borderwar.15.d:0 "侵略者は我が国境を破ること能わず、遂に兵を退けり。尤も、我が軍も之を追撃するには至らず。"
 borderwar.15.a:0 "せいぜい国境の向こうで震えておれ"
